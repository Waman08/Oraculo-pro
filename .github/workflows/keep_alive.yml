name: Backend Keep-Alive Cron

on:
  schedule:
    # Ejecutar cada 10 minutos para prevenir la suspensin de Render
    - cron: "*/10 * * * *"
  workflow_dispatch: # Permite ejecucin manual

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API Health Endpoint
        run: |
          # Utilizamos la variable de entorno del API_URL si existe, 
          # o una URL por defecto (se recomienda configurar RENDER_API_URL en Github Secrets)
          API_URL="${{ secrets.RENDER_API_URL }}"
          if [ -z "$API_URL" ]; then
            API_URL="https://oraculo-pro-backend.onrender.com"
          fi
          
          echo "Pinging backend at: $API_URL/api/health"
          
          # Hacemos un GET request esperando un HTTP 200 OK
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$API_URL/api/health")
          
          echo "HTTP Status: $HTTP_STATUS"
          
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Warning: Health endpoint returned $HTTP_STATUS"
            # No forzamos falla para no saturar de notificaciones, pero advertimos en log
          else
            echo "Success: Backend is alive and responded 200 OK."
          fi
